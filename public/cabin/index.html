    <canvas class="webgl"></canvas>

    <!-- 启动覆盖层：点击进入，同时解锁 AudioContext -->

      <div class="overlay-inner">
        <h1>海边木屋</h1>
        <p class="overlay-sub">蓝 调 时 刻 · 礁 岸 藏 着 五 件 宝 物</p>

      </div>

    <!-- 宝物内容面板（marked 渲染 markdown） -->

      <div class="panel-header">
        <span class="panel-type"></span>
        <h2 class="panel-title"></h2>
        <button class="panel-close" aria-label="关闭">×</button>
      </div>
      <article class="panel-body"></article>
      <footer class="panel-hint"></footer>
    </aside>

    <!-- 点灯进度 -->
    <div id="lights-hud">灯火 <span id="lights-count">0</span> / <span id="lights-total">5</span></div>
